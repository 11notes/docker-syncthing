name: "syncthing"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  server:
    image: "11notes/syncthing:2.1.7"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      SYNCTHING_PASSWORD: "${SYNCTHING_PASSWORD}"
      SYNCTHING_API_KEY: "${SYNCTHING_API_KEY}"
    volumes:
      - "syncthing.etc:/syncthing/etc"
      - "syncthing.var:/syncthing/var"
      - "syncthing.share:/syncthing/share"
    ports:
      - "3000:8384/tcp"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      frontend:
    restart: "always"

volumes:
  syncthing.etc:
  syncthing.var:
  syncthing.share:

networks:
  frontend: